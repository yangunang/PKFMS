<!DOCTYPE html>
<html lang="{{ LANG }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ file.filename }} — {{ T.descTitle }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: oklch(0.97 0.01 85); --ink: oklch(0.28 0.02 60); --muted: oklch(0.6 0.02 60); --accent: oklch(0.55 0.12 150); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); font-family: 'Nunito', sans-serif; color: var(--ink);
    display: flex; justify-content: center; padding: 40px 20px; }
  a { color: var(--accent); font-weight: 700; }
  a:hover { color: oklch(0.45 0.12 150); }
  .card { width: 100%; max-width: 760px; background: #fff; border-radius: 20px; padding: 28px 32px;
    box-shadow: 0 2px 12px oklch(0.28 0.02 60 / 0.06); display: flex; flex-direction: column; gap: 18px; align-self: flex-start; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .back { border: none; background: oklch(0.95 0.01 85); color: oklch(0.35 0.02 60); border-radius: 999px; padding: 8px 18px;
    font: 700 14px 'Nunito', sans-serif; cursor: pointer; text-decoration: none; }
  .back:hover { background: oklch(0.92 0.015 85); color: oklch(0.35 0.02 60); }
  h1 { margin: 0; font-size: 22px; font-weight: 800; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; }
  .edit-btn { border: none; background: oklch(0.95 0.01 85); color: oklch(0.35 0.02 60); border-radius: 999px; width: 36px; height: 36px;
    cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .edit-btn:hover { filter: brightness(0.96); }
  .edit-btn.editing { background: var(--accent); color: #fff; }
  .tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tags .lbl { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 8px 5px 14px;
    font-size: 13px; font-weight: 700; background: oklch(0.93 0.06 150); color: oklch(0.4 0.1 150); }
  .tag button { border: none; background: oklch(0.4 0.1 150 / 0.12); color: oklch(0.4 0.1 150); border-radius: 999px;
    width: 18px; height: 18px; cursor: pointer; font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .tag button:hover { background: oklch(0.4 0.1 150 / 0.25); }
  #add-tag { appearance: none; border: 1.5px dashed oklch(0.85 0.02 85); border-radius: 999px; padding: 5px 14px;
    font: 700 13px 'Nunito', sans-serif; cursor: pointer; background: transparent; color: oklch(0.55 0.02 60); }
  #add-tag:hover, #add-tag:focus { outline: none; border-color: var(--accent); color: oklch(0.45 0.12 150); }
  #editor { display: none; flex-direction: column; gap: 8px; }
  #editor.open { display: flex; }
  #editor textarea { border: 1.5px solid oklch(0.88 0.01 85); border-radius: 14px; padding: 14px 16px;
    font: 400 14px 'JetBrains Mono', monospace; color: oklch(0.32 0.02 60); resize: vertical; line-height: 1.6; min-height: 220px; }
  #editor textarea:focus { outline: none; border-color: var(--accent); }
  #editor small { color: var(--muted); font-size: 12px; }
  #rendered { font-size: 15px; line-height: 1.65; color: oklch(0.35 0.02 60); }
  #rendered h3, #rendered h4, #rendered h5 { margin: 14px 0 4px; font-weight: 800; color: var(--ink); }
  #rendered h3 { font-size: 22px; } #rendered h4 { font-size: 18px; } #rendered h5 { font-size: 15.5px; }
  #rendered p { margin: 6px 0; }
  #rendered ul { margin: 4px 0; padding-left: 22px; } #rendered li { margin: 3px 0; }
  #rendered code { background: oklch(0.95 0.01 85); border-radius: 6px; padding: 2px 6px; font: 0.9em 'JetBrains Mono', monospace; }
  #rendered pre { background: oklch(0.96 0.01 85); border-radius: 12px; padding: 14px 16px; overflow: auto;
    font: 12.5px 'JetBrains Mono', monospace; line-height: 1.55; }
  #rendered pre code { background: none; padding: 0; }
  .empty-desc { color: var(--muted); font-style: italic; }
  .saved { font-size: 12.5px; color: var(--accent); font-weight: 700; opacity: 0; transition: opacity 0.3s; }
  .saved.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <a class="back" href="/files">{{ T.back }}</a>
    <h1>{{ file.filename }}</h1>
    <span class="badge" id="env-badge">{{ file.env }}</span>
    <span class="badge" id="cat-badge">{{ file.category }}</span>
    <span class="saved" id="saved">✓</span>
    <button class="edit-btn" id="edit" title="{{ T.unlockEdit }}">&#9998;</button>
  </div>
  <div class="tags">
    <span class="lbl">&#127991; {{ T.tags }}</span>
    <span id="tag-list"></span>
    <select id="add-tag"><option value="">{{ T.tagPh }}</option></select>
  </div>
  <div id="editor">
    <textarea id="src" placeholder="{{ T.descPh }}">{{ desc }}</textarea>
    <small>{{ T.mdHint }}</small>
  </div>
  <div id="rendered"></div>
</div>
<script>
const T = {{ T | tojson }};
const ENVS = {{ environments | tojson }};
const CATS = {{ categories | tojson }};
const ACCOUNTS = {{ accounts | tojson }};
let TAGS = {{ tags | tojson }};
const FILE_ID = {{ file.id }};
const HUES = [150, 250, 55, 320, 200, 20, 100, 280];
const tint = (list, name, offset) => {
  const i = Math.max(0, list.indexOf(name));
  const h = HUES[(i + offset) % HUES.length];
  return { bg: `oklch(0.93 0.06 ${h})`, fg: `oklch(0.4 0.1 ${h})` };
};
(() => { const b = document.getElementById('env-badge'); const c = tint(ENVS, b.textContent, 0); b.style.background = c.bg; b.style.color = c.fg; })();
(() => { const b = document.getElementById('cat-badge'); const c = tint(CATS, b.textContent, 4); b.style.background = c.bg; b.style.color = c.fg; })();

const patch = body => fetch('/api/files/' + FILE_ID, { method: 'PATCH',
  headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  .then(() => { const s = document.getElementById('saved'); s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1200); });

const tagList = document.getElementById('tag-list');
const addTag = document.getElementById('add-tag');
function renderTags() {
  tagList.innerHTML = '';
  for (const id of TAGS) {
    const a = ACCOUNTS.find(x => x.id === id);
    if (!a) continue;
    const span = document.createElement('span');
    span.className = 'tag';
    span.append(a.label);
    const btn = document.createElement('button');
    btn.textContent = '\u00d7';
    btn.onclick = () => { TAGS = TAGS.filter(t => t !== id); patch({ tags: TAGS }); renderTags(); };
    span.append(btn);
    tagList.append(span, ' ');
  }
  addTag.innerHTML = '<option value="">' + T.tagPh + '</option>';
  for (const a of ACCOUNTS.filter(x => !TAGS.includes(x.id))) {
    const o = document.createElement('option');
    o.value = a.id; o.textContent = a.label;
    addTag.append(o);
  }
  addTag.style.display = ACCOUNTS.some(x => !TAGS.includes(x.id)) ? '' : 'none';
}
addTag.addEventListener('change', () => {
  if (!addTag.value) return;
  TAGS.push(+addTag.value); patch({ tags: TAGS }); renderTags();
});
renderTags();

const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = t => esc(t)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\*([^*]+)\*/g, '<em>$1</em>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
function mdToHtml(src) {
  const lines = (src || '').split('\n');
  let html = '', list = false, code = false, buf = [];
  const closeList = () => { if (list) { html += '</ul>'; list = false; } };
  for (const ln of lines) {
    if (ln.trim().startsWith('```')) {
      if (code) { html += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>'; buf = []; }
      code = !code; continue;
    }
    if (code) { buf.push(ln); continue; }
    const h = ln.match(/^(#{1,3})\s+(.*)/);
    if (h) { closeList(); html += `<h${h[1].length + 2}>${inline(h[2])}</h${h[1].length + 2}>`; continue; }
    if (/^\s*[-*]\s+/.test(ln)) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + inline(ln.replace(/^\s*[-*]\s+/, '')) + '</li>'; continue; }
    closeList();
    if (ln.trim() === '') continue;
    html += '<p>' + inline(ln) + '</p>';
  }
  closeList();
  if (code && buf.length) html += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
  return html;
}

const srcEl = document.getElementById('src');
const rendered = document.getElementById('rendered');
const render = () => {
  const v = srcEl.value.trim();
  rendered.innerHTML = v ? mdToHtml(srcEl.value) : '<p class="empty-desc">' + esc(T.emptyDesc) + '</p>';
};
render();

const editBtn = document.getElementById('edit');
const editor = document.getElementById('editor');
editBtn.addEventListener('click', () => {
  const open = editor.classList.toggle('open');
  editBtn.classList.toggle('editing', open);
  editBtn.innerHTML = open ? '&#10003;' : '&#9998;';
  editBtn.title = open ? T.doneEdit : T.unlockEdit;
  if (open) srcEl.focus();
});

let timer = null;
srcEl.addEventListener('input', () => {
  render();
  clearTimeout(timer);
  timer = setTimeout(() => patch({ description: srcEl.value }), 500);
});
</script>
</body>
</html>
